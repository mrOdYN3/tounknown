<!-- @dsCard group="Colors" viewport="700x170" subtitle="Admin Studio — night surfaces, same gold" name="Dark theme" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:linear-gradient(180deg,var(--night-1),var(--night-2));padding:16px;display:flex;gap:10px}
.sw{flex:1;border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;justify-content:flex-end;height:126px;border:0.5px solid var(--night-hairline);color:var(--night-text)}
.sw b{font-size:12px}.sw span{font-size:10.5px;opacity:0.6;font-variant-numeric:tabular-nums}</style></head><body>
<div class="sw" style="background:var(--night-1)"><b>night-1</b><span>#0B0B10</span></div>
<div class="sw" style="background:var(--night-surface)"><b>surface</b><span>white 4%</span></div>
<div class="sw" style="background:var(--night-surface-2)"><b>surface-2</b><span>white 7%</span></div>
<div class="sw" style="background:var(--gold-bright);color:var(--night-1)"><b>gold</b><span>#D9A441</span></div>
<div class="sw" style="background:var(--night-sage);color:var(--night-1)"><b>sage</b><span>#7FB069</span></div>
<div class="sw" style="background:var(--error);color:var(--night-1)"><b>error</b><span>#E06C5A</span></div>
</body></html>
