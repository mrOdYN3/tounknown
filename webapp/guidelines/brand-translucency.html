<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);padding:0;background:url('https://assets.zyrosite.com/cdn-cgi/image/format=auto,w=1440,h=756,fit=crop,f=jpeg/d95DMJoWQZi9KZO2/vipassana-meditation-mjEPpWR2lWHvRnVz.jpg') center/cover;height:200px;display:flex;flex-direction:column;justify-content:space-between}
.bar{background:var(--surface-blur);backdrop-filter:var(--blur-header);-webkit-backdrop-filter:var(--blur-header);padding:14px 20px;font-size:13px;font-weight:600;color:var(--ink)}</style></head><body>
<div class="bar" style="border-bottom:var(--border-hairline)">header · rgba(251,250,247,.78) + blur(24px) saturate(1.8)</div>
<div class="bar" style="border-top:var(--border-hairline)">tab bar · rgba(251,250,247,.82) + blur(26px) saturate(1.8)</div>
</body></html>
