<!-- @dsCard group="Spacing" viewport="700x170" subtitle="8pt grid — 4 to 52" name="Spacing scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--paper-1);padding:20px 24px;display:flex;gap:18px;align-items:flex-end}
.s{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--text-tertiary);font-variant-numeric:tabular-nums}
.bar{width:26px;background:rgba(217,164,65,0.35);border:0.5px solid rgba(168,120,31,0.4);border-radius:5px}</style></head><body>
<div class="s"><div class="bar" style="height:4px"></div>4</div>
<div class="s"><div class="bar" style="height:8px"></div>8</div>
<div class="s"><div class="bar" style="height:12px"></div>12</div>
<div class="s"><div class="bar" style="height:16px"></div>16</div>
<div class="s"><div class="bar" style="height:20px"></div>20 · gutter</div>
<div class="s"><div class="bar" style="height:24px"></div>24</div>
<div class="s"><div class="bar" style="height:32px"></div>32</div>
<div class="s"><div class="bar" style="height:40px"></div>40</div>
<div class="s"><div class="bar" style="height:52px"></div>52 · interlude</div>
</body></html>
