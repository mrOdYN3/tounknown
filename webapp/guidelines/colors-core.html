<!-- @dsCard group="Colors" viewport="700x180" subtitle="Paper whites, ink, and one gold accent" name="Core palette" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);display:flex;gap:10px;padding:16px;background:var(--paper-1)}
.sw{flex:1;border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;justify-content:flex-end;height:130px;border:var(--border-hairline)}
.sw b{font-size:12px;letter-spacing:-0.1px}.sw span{font-size:10.5px;opacity:0.65;font-variant-numeric:tabular-nums}</style></head><body>
<div class="sw" style="background:var(--paper-1)"><b>paper-1</b><span>#FBFAF7 · bg</span></div>
<div class="sw" style="background:var(--paper-2)"><b>paper-2</b><span>#F5F3ED</span></div>
<div class="sw" style="background:var(--white);box-shadow:var(--shadow-card)"><b>surface</b><span>#FFFFFF · cards</span></div>
<div class="sw" style="background:var(--sand)"><b>sand</b><span>#F2EFE8</span></div>
<div class="sw" style="background:var(--ink);color:#FBFAF7"><b>ink</b><span>#191813</span></div>
<div class="sw" style="background:var(--gold-deep);color:#fff"><b>gold deep</b><span>#A8781F · text</span></div>
<div class="sw" style="background:var(--gold-bright);color:#191813"><b>gold bright</b><span>#D9A441 · fills</span></div>
</body></html>
