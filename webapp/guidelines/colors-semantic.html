<!-- @dsCard group="Colors" viewport="700x160" subtitle="Ink opacities, sage, hairline, error" name="Text & semantic" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:#fff;padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:8px 28px;align-items:center}
.row{display:flex;align-items:center;gap:12px;font-size:14px}
.dot{width:26px;height:26px;border-radius:8px;flex:0 0 auto;border:var(--border-hairline)}
small{color:var(--text-tertiary);font-variant-numeric:tabular-nums;margin-left:auto;font-size:11px}</style></head><body>
<div class="row"><span class="dot" style="background:var(--ink)"></span><span style="color:var(--text-body)">Body ink</span><small>#191813</small></div>
<div class="row"><span class="dot" style="background:var(--sage)"></span><span style="color:var(--sage);font-weight:600">Sage — done, positive</span><small>#5E8A4A</small></div>
<div class="row"><span class="dot" style="background:var(--ink-60)"></span><span style="color:var(--text-secondary)">Secondary 60%</span><small>rgba(25,24,19,.60)</small></div>
<div class="row"><span class="dot" style="background:rgba(224,108,90,1)"></span><span style="color:#E06C5A;font-weight:600">Error (admin only)</span><small>#E06C5A</small></div>
<div class="row"><span class="dot" style="background:var(--ink-38)"></span><span style="color:var(--text-tertiary)">Tertiary 38%</span><small>rgba(25,24,19,.38)</small></div>
<div class="row"><span class="dot" style="background:#fff;border:0.5px solid rgba(24,22,16,0.35)"></span><span>Hairline borders</span><small>rgba(24,22,16,.09) · 0.5px</small></div>
</body></html>
