<!-- @dsCard group="App" viewport="1280x800" name="toUnknown desktop" subtitle="Desktop web adaptation — top nav, grid layouts" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>toUnknown — desktop UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font-sans);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
background:linear-gradient(180deg,var(--paper-1) 0%,var(--paper-2) 100%);min-height:100vh}
a{color:var(--gold-deep);text-decoration:none}a:hover{color:var(--gold-bright)}
summary{list-style:none}summary::-webkit-details-marker{display:none}
.nav-link{background:none;border:0;cursor:pointer;font:inherit;font-size:14.5px;font-weight:500;color:var(--text-secondary);padding:8px 14px;border-radius:999px;transition:all .25s var(--spring)}
.nav-link:hover{color:var(--ink);background:var(--surface-2)}
.nav-link.on{color:var(--gold-deep);background:rgba(217,164,65,0.14);font-weight:600}
main .rv{opacity:0;transform:translateY(22px);transition:opacity .6s var(--spring),transform .6s var(--spring)}
main .rv.in{opacity:1;transform:none}
main [role="button"],main a>div{transition:transform .35s var(--spring),box-shadow .35s var(--spring)}
main [role="button"]:hover{transform:translateY(-3px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}main .rv{opacity:1;transform:none}}
</style></head>
<body>
<div id="root"></div>
<script type="text/babel" src="DesktopScreens.jsx"></script>
<script type="text/babel" src="PathSheet.jsx"></script>
<script type="text/babel">
const { Orb, Button, Toast } = window.ToUnknownDesignSystem_9d38c1;
const NAV = [["home","Home"],["paths","Mārga"],["community","Sangha"],["membership","Dāna"],["profile","Sādhana"]];
function App(){
  const [view,setView] = React.useState("home");
  const [scrolled,setScrolled] = React.useState(false);
  const [path,setPath] = React.useState(null);
  const [toastMsg,setToastMsg] = React.useState(null);
  React.useEffect(()=>{
    const f=()=>setScrolled(window.scrollY>40);
    addEventListener("scroll",f,{passive:true});
    return ()=>removeEventListener("scroll",f);
  },[]);
  const go = v=>{ setView(v); window.scrollTo({top:0,behavior:"instant"}); };
  React.useEffect(()=>{
    const els = document.querySelectorAll("main > div > *:not(.rv)");
    els.forEach(el=>el.classList.add("rv"));
    const io = new IntersectionObserver(es=>es.forEach((e,i)=>{
      if(e.isIntersecting){ setTimeout(()=>e.target.classList.add("in"),(i%4)*70); io.unobserve(e.target); }
    }),{threshold:0.1});
    document.querySelectorAll("main .rv:not(.in)").forEach(el=>io.observe(el));
    return ()=>io.disconnect();
  },[view]);
  const toast = ()=>{ setToastMsg("Payment link not connected in the UI kit 🙏"); setTimeout(()=>setToastMsg(null),2600); };
  const S = { home:<DHome go={go} openPath={setPath}/>, paths:<DPaths openPath={setPath}/>,
    community:<DSangha go={go}/>, membership:<DDana go={go} toast={toast}/>, profile:<DProfile/> };
  return <div>
    <header style={{position:"sticky",top:0,zIndex:20,background:"var(--surface-blur)",backdropFilter:"var(--blur-header)",WebkitBackdropFilter:"var(--blur-header)",
      borderBottom:scrolled?"0.5px solid var(--hairline)":"0.5px solid transparent",transition:"border-color .3s"}}>
      <div style={{maxWidth:1100,margin:"0 auto",padding:"12px 32px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:20}}>
        <div style={{display:"flex",alignItems:"center",gap:9,fontWeight:700,fontSize:16,cursor:"pointer"}} onClick={()=>go("home")}>
          <img src={window.TU.logo} alt="toUnknown logo" style={{height:30,width:"auto",borderRadius:7}}/> toUnknown
        </div>
        <nav aria-label="Main" style={{display:"flex",gap:2}}>
          {NAV.map(([id,label])=><button key={id} className={"nav-link"+(view===id?" on":"")} onClick={()=>go(id)}>{label}</button>)}
        </nav>
        <Button style={{padding:"10px 18px",fontSize:14}} onClick={()=>go("membership")}>Begin</Button>
      </div>
    </header>
    <main data-screen-label={NAV.find(n=>n[0]===view)[1]} style={{paddingBottom:40}}>{S[view]}</main>
    <PathSheet path={path} onClose={()=>setPath(null)}/>
    {toastMsg && <Toast fixed show message={toastMsg} style={{bottom:40}}/>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
