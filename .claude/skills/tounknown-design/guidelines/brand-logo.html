<!-- @dsCard group="Brand" viewport="700x280" subtitle="The trident-tree mark + wordmark — black on light, gold for ceremony, white on dark" name="Logo" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);display:flex;flex-direction:column;height:280px}
.row{flex:1;display:flex}
.cell{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:11px}
.cell img{width:92px;height:auto}
.cell img.wm{width:150px}
.cell span{text-transform:uppercase;letter-spacing:0.08em;font-weight:600}</style></head><body>
<div class="row">
<div class="cell" style="background:var(--paper-1);color:var(--text-tertiary)"><img src="../assets/logo-black.png" alt="toUnknown mark, black"><span>black · light surfaces</span></div>
<div class="cell" style="background:var(--paper-2);color:var(--gold-deep)"><img src="../assets/logo-gold.png" alt="toUnknown mark, gold"><span>gold · ceremonial</span></div>
<div class="cell" style="background:var(--night-1);color:rgba(245,244,240,0.5)"><img src="../assets/logo-white.png" alt="toUnknown mark, white"><span>white · dark / scrims</span></div>
</div>
<div class="row" style="max-height:90px">
<div class="cell" style="background:var(--paper-1);color:var(--text-tertiary)"><img class="wm" src="../assets/wordmark-black.png" alt="toUnknown wordmark, black"><span>wordmark · light</span></div>
<div class="cell" style="background:var(--night-1);color:rgba(245,244,240,0.5)"><img class="wm" src="../assets/wordmark-white.png" alt="toUnknown wordmark, white"><span>wordmark · dark</span></div>
</div>
</body></html>
