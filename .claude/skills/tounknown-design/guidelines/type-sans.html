<!-- @dsCard group="Type" viewport="700x230" subtitle="SF Pro system stack — large title to label" name="Sans scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--paper-1);color:var(--ink);padding:18px 22px;display:flex;flex-direction:column;gap:7px}
small{color:var(--text-tertiary);font-size:10.5px;font-variant-numeric:tabular-nums;margin-left:12px;font-weight:400;letter-spacing:0}</style></head><body>
<div style="font:var(--type-large-title);letter-spacing:var(--tracking-large-title)">Large Title<small>34 / 700 / −0.4px</small></div>
<div style="font:var(--type-title);letter-spacing:var(--tracking-title)">Title<small>22 / 600 / −0.3px</small></div>
<div style="font:var(--type-compact-header);letter-spacing:var(--tracking-compact)">Compact header (on scroll)<small>17 / 600</small></div>
<div style="font:var(--type-body)">Body — see things as they are.<small>17 / 400 / 1.5</small></div>
<div style="font:var(--type-caption);color:var(--text-secondary)">Caption — 5 sittings · first gate free<small>13 / 400</small></div>
<div style="font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary)">Label · the ancient paths, guided<small>11 / 600 / +0.08em</small></div>
</body></html>
