<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>toUnknown — app UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font-sans);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
background:radial-gradient(70% 50% at 20% 0%,rgba(217,164,65,0.10),transparent 60%),radial-gradient(60% 50% at 85% 100%,rgba(140,120,190,0.08),transparent 60%),var(--stage)}
a{color:var(--gold-deep);text-decoration:none}a:hover{color:var(--gold-bright)}
summary{list-style:none}summary::-webkit-details-marker{display:none}
main .rv{opacity:0;transform:translateY(22px);transition:opacity .6s var(--spring),transform .6s var(--spring)}
main .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}main .rv{opacity:1;transform:none}}
</style></head>
<body>
<div id="root"></div>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="PathsScreen.jsx"></script>
<script type="text/babel" src="SanghaScreen.jsx"></script>
<script type="text/babel" src="DanaScreen.jsx"></script>
<script type="text/babel" src="ProfileScreen.jsx"></script>
<script type="text/babel" src="PathSheet.jsx"></script>
<script type="text/babel">
const { AppHeader, TabBar, Toast } = window.ToUnknownDesignSystem_9d38c1;
const TITLES = { home:"Home", paths:"Mārga — the Paths", community:"Sangha", membership:"Dāna & Membership", profile:"Your sādhana" };
function App(){
  const [view,setView] = React.useState("home");
  const [scrolled,setScrolled] = React.useState(false);
  const [path,setPath] = React.useState(null);
  const [toastMsg,setToastMsg] = React.useState(null);
  React.useEffect(()=>{
    const f=()=>setScrolled(window.scrollY>60);
    addEventListener("scroll",f,{passive:true});
    return ()=>removeEventListener("scroll",f);
  },[]);
  const go = v=>{ setView(v); window.scrollTo({top:0,behavior:"instant"}); };
  React.useEffect(()=>{
    const els = document.querySelectorAll("main > div > *:not(.rv)");
    els.forEach(el=>el.classList.add("rv"));
    const io = new IntersectionObserver(es=>es.forEach((e,i)=>{
      if(e.isIntersecting){ setTimeout(()=>e.target.classList.add("in"),(i%4)*70); io.unobserve(e.target); }
    }),{threshold:0.1});
    document.querySelectorAll("main .rv:not(.in)").forEach(el=>io.observe(el));
    return ()=>io.disconnect();
  },[view]);
  const toast = ()=>{ setToastMsg("Payment link not connected in the UI kit 🙏"); setTimeout(()=>setToastMsg(null),2600); };
  const S = { home:<HomeScreen go={go} openPath={setPath}/>, paths:<PathsScreen openPath={setPath}/>,
    community:<SanghaScreen go={go}/>, membership:<DanaScreen go={go} toast={toast}/>, profile:<ProfileScreen/> };
  return <div style={{maxWidth:430,margin:"0 auto",minHeight:"100vh",position:"relative",
    background:"linear-gradient(180deg,var(--paper-1) 0%,var(--paper-2) 100%)",boxShadow:"var(--shadow-frame)"}}>
    <AppHeader logo={window.TU.logo} title={TITLES[view]} scrolled={scrolled}/>
    <main data-screen-label={TITLES[view]} style={{paddingBottom:96}}>{S[view]}</main>
    <TabBar active={view} onChange={go}/>
    <PathSheet path={path} onClose={()=>setPath(null)}/>
    {toastMsg && <Toast fixed show message={toastMsg}/>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
