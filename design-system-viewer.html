<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toUnknown — Design System Viewer</title>
<style>
  :root { --paper:#FBFAF7; --ink:#191813; --gold:#A8781F; --line:#E9E5DC; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,sans-serif; padding:48px 32px 96px; }
  header { max-width:1100px; margin:0 auto 40px; }
  h1 { font-size:28px; letter-spacing:-0.02em; }
  h1 em { font-family:Georgia,"Times New Roman",serif; font-style:italic; color:var(--gold); font-weight:400; }
  header p { color:#6b675e; margin-top:6px; font-size:14px; }
  h2 { max-width:1100px; margin:56px auto 16px; font-size:13px; text-transform:uppercase; letter-spacing:0.12em; color:var(--gold); }
  .grid { max-width:1100px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(480px,1fr)); gap:24px; }
  figure { background:#fff; border:1px solid var(--line); border-radius:20px; overflow:hidden; box-shadow:0 1px 2px rgba(25,24,19,.04); }
  figcaption { padding:12px 18px; font-size:13px; font-weight:600; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  figcaption a { color:var(--gold); font-weight:500; font-size:12px; text-decoration:none; }
  iframe { width:100%; height:420px; border:0; display:block; background:#fff; }
  .tall iframe { height:640px; }
</style>
</head>
<body>
<header>
  <h1>toUnknown <em>design system</em></h1>
  <p>Live gallery of every guideline page and component card in <code>toUnknown Design System/</code>. Click "open" on any tile to view it full-page.</p>
</header>

<h2>Colors</h2>
<div class="grid" data-dir="guidelines" data-pages="colors-core,colors-gold,colors-semantic,colors-dark"></div>

<h2>Typography</h2>
<div class="grid" data-dir="guidelines" data-pages="type-sans,type-serif,type-numerals"></div>

<h2>Spacing</h2>
<div class="grid" data-dir="guidelines" data-pages="spacing-scale,spacing-radii"></div>

<h2>Brand</h2>
<div class="grid" data-dir="guidelines" data-pages="brand-logo,brand-imagery,brand-icons,brand-motion,brand-shadows,brand-translucency,brand-ancient"></div>

<h2>Components</h2>
<div class="grid tall" data-dir="components" data-pages="core/core.card,core/social.card,cards/cards.card,lists/lists.card,navigation/navigation.card,overlays/overlays.card,dana/dana.card"></div>

<script>
const BASE = 'toUnknown%20Design%20System/';
document.querySelectorAll('.grid').forEach(grid => {
  const dir = grid.dataset.dir;
  grid.dataset.pages.split(',').forEach(p => {
    const url = BASE + dir + '/' + p + '.html';
    const name = p.split('/').pop().replace('.card','').replace(/-/g,' ');
    const fig = document.createElement('figure');
    fig.innerHTML = `<figcaption>${name}<a href="${url}" target="_blank">open ↗</a></figcaption><iframe loading="lazy" src="${url}"></iframe>`;
    grid.appendChild(fig);
  });
});
</script>
</body>
</html>
