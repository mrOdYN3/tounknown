# nft.tounknown.com — SoulFlow NFT
server {
    server_name nft.tounknown.com;
    root /var/www/tounknown-sites/nft;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(jpg|jpeg|png|webp|svg|ico|css|js)$ { expires 7d; add_header Cache-Control "public"; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tounknown-subdomains/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tounknown-subdomains/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# vipassana.tounknown.com — Russian course site
server {
    server_name vipassana.tounknown.com;
    root /var/www/tounknown-sites/vipassana;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(jpg|jpeg|png|webp|svg|ico|css|js)$ { expires 7d; add_header Cache-Control "public"; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tounknown-subdomains/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tounknown-subdomains/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = nft.tounknown.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name nft.tounknown.com;
    return 404; # managed by Certbot


}
server {
    if ($host = vipassana.tounknown.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name vipassana.tounknown.com;
    return 404; # managed by Certbot


}