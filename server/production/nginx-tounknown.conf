server {
    server_name tounknown.com www.tounknown.com srv1873771.hstgr.cloud 72.60.170.97 _;

    root /var/www/tounknown;

    index index.html;

    # Without this, nginx sends text/html with no charset and browsers fall back to latin-1,
    # so every ā, ī and em dash on a page that lacks its own meta charset renders as mojibake.
    charset utf-8;
    charset_types text/css text/plain application/javascript application/json;   # text/html is implicit

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /protected-audio/ {
        internal;
        alias /srv/audio/;
        add_header Cache-Control "private, max-age=3600";
        add_header Accept-Ranges bytes;
    }

    location /ds/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location /ru { try_files /ru/index.html =404; }
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tounknown.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tounknown.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = srv1873771.hstgr.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name tounknown.com www.tounknown.com srv1873771.hstgr.cloud 72.60.170.97 _;
    return 404; # managed by Certbot


}